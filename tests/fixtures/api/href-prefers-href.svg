<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="20" height="20">
  <defs>
    <rect id="green" width="20" height="20" fill="#00ff00"/>
    <rect id="red" width="20" height="20" fill="#ff0000"/>
  </defs>
  <use href="#green" xlink:href="#red"/>
</svg>
