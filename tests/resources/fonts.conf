<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- C-test copy of rust/rsvg/tests/resources/fonts.conf (librsvg 2.62.3).
     Data only. Cache is private; do not run fc-cache on the host. -->
<fontconfig>
  <cachedir>/tmp/rsvg_c_tests_fontconfig_cache</cachedir>

  <!--
      From openSUSE's fonts.conf:
      Accept deprecated 'sans' alias, replacing it with 'sans-serif'
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>

  <!--
      Map 'serif' to 'sans-serif' since we don't have a serif font in the test resources yet.
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>

  <!--
    Names not including any well known alias are given 'sans-serif'
  -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append_last">
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- Map generic family names to actual fonts -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>

</fontconfig>
